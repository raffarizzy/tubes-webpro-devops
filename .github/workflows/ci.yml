name: CI

# Berjalan otomatis pada setiap push dan pull request ke main atau devops-uts.
on:
  push:
    branches: [main, devops-uts]
  pull_request:
    branches: [main]

# Hak akses minimal: workflow hanya perlu membaca isi repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel (build + Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, libxml, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: pcov

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependency
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan test + coverage
        run: ./vendor/bin/pest --coverage-clover=coverage.xml

      - name: Simpan coverage
        uses: actions/upload-artifact@v4
        with:
          name: laravel-coverage
          path: coverage.xml

  node-api:
    name: Node API (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: node-api/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Jalankan test + coverage
        run: npm test

      - name: Simpan coverage
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: node-api/coverage/lcov.info

  dependency-check:
    name: Dependency check (DevSecOps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Audit membaca composer.lock dan package-lock.json, jadi tidak perlu install.
      # Laporan disimpan sebagai artifact agar bisa dianalisis di laporan UTS.
      - name: composer audit
        run: composer audit --locked --format=plain | tee composer-audit.txt
        continue-on-error: true

      - name: npm audit (node-api)
        working-directory: node-api
        run: npm audit --package-lock-only | tee ../npm-audit.txt
        continue-on-error: true

      - name: Simpan laporan audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            composer-audit.txt
            npm-audit.txt

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [laravel, node-api]
    # Token tidak tersedia untuk PR dari fork; lewati agar pipeline tidak merah.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud butuh riwayat penuh untuk blame dan new-code

      - name: Ambil coverage Laravel
        uses: actions/download-artifact@v4
        with:
          name: laravel-coverage

      - name: Ambil coverage Node
        uses: actions/download-artifact@v4
        with:
          name: node-coverage
          path: node-api/coverage

      - name: Scan SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
